name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
        include:
          - os: macos-latest
            python: '3.14'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install standalone test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run isolated unit and API tests
        env:
          HERMES_PY: python
        run: bash tests/run_all.sh
      - name: Compile Python sources
        run: python -m compileall -q engine dashboard tests

  dashboard-demo:
    name: Synthetic dashboard browser check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install playwright==1.64.0
      - run: python -m playwright install --with-deps chromium
      - name: Render actual frontend with labelled synthetic fixtures
        run: python scripts/capture_demo.py
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-dashboard
          path: docs/images/dashboard.png
          retention-days: 7
